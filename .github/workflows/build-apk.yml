name: Build Android APK (offline app)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/
      - run: npm install
      - name: Bundle OCR engine and languages (offline)
        run: bash vendor.sh
      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow
          python3 icons.py
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceControl-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
